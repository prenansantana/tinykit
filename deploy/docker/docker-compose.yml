version: '3.8'

services:
  crud-one:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Coolify: declare this service needs a public FQDN on port 3000.
      # Coolify populates the value at deploy time from the resource's domain setting.
      - SERVICE_FQDN_CRUD_ONE_3000

      # Required: AI Provider
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}

      # Server config
      - HOST=0.0.0.0
      - PORT=3000
      - WORKSPACE_DIR=/app/workspace

    volumes:
      # Persistent storage
      - pocketbase_data:/app/pocketbase/pb_data
      - workspace_data:/app/workspace

    restart: unless-stopped

volumes:
  pocketbase_data:
  workspace_data:
