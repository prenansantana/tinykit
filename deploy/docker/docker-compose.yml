version: '3.8'

services:
  crud-one:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Coolify magic var: declares this service should be reachable on the
      # public domain and routed to container port 3000. Convention matches
      # official Coolify templates (e.g. SERVICE_URL_GRAFANA_3000).
      - SERVICE_URL_CRUD_ONE_3000

      # Required: AI Provider
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}

      # Server config
      - HOST=0.0.0.0
      - PORT=3000
      - WORKSPACE_DIR=/app/workspace

    volumes:
      # Persistent storage
      - pocketbase_data:/app/pocketbase/pb_data
      - workspace_data:/app/workspace

    restart: unless-stopped

volumes:
  pocketbase_data:
  workspace_data:
